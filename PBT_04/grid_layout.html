<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Grid Layout E‑Commerce</title>
  <link rel="stylesheet" href="grid.css">
</head>
<body>
  <div class="site-grid">
    <header class="site-header">HEADER</header>
    <div class="hero"> 
      <div class="featured">
        <h2>Featured Product</h2>
        <div class="card big"><div class="thumb"></div><h3>Hot Item</h3></div>
      </div>
    </div>
    <aside class="sidebar">
      <h3>Filters</h3>
      <label><input type="checkbox"> Option 1</label><br>
      <label><input type="checkbox"> Option 2</label><br>
      <label><input type="checkbox"> Option 3</label>
    </aside>
    <main class="main">
      <div class="products">
        <div class="card"><div class="thumb"></div><h3>1</h3></div>
        <div class="card"><div class="thumb"></div><h3>2</h3></div>
        <div class="card"><div class="thumb"></div><h3>3</h3></div>
        <div class="card"><div class="thumb"></div><h3>4</h3></div>
        <div class="card"><div class="thumb"></div><h3>5</h3></div>
        <div class="card"><div class="thumb"></div><h3>6</h3></div>
      </div>
    </main>
    <aside class="ads">ADS</aside>
    <footer class="site-footer">FOOTER</footer>
  </div>
</body>
</html>
