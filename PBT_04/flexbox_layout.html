<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Flexbox Layout</title>
  <link rel="stylesheet" href="flexbox.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">ShopTLU</div>
    <ul class="menu">
      <li><a href="#">Home</a></li>
      <li><a href="#">Products</a></li>
      <li><a href="#">About</a></li>
    </ul>
    <div class="auth">
      <button class="btn">Login</button>
      <button class="btn primary">Register</button>
    </div>
  </header>

  <main class="catalog">
    <h1>Products</h1>
    <div class="cards">
      <!-- 8 cards -->
      <div class="card"><div class="thumb"></div><h3>Product 1</h3><p class="price">100</p><button>Buy</button></div>
      <div class="card"><div class="thumb"></div><h3>Product 2</h3><p class="price">200</p><button>Buy</button></div>
      <div class="card"><div class="thumb"></div><h3>Product 3</h3><p class="price">300</p><button>Buy</button></div>
      <div class="card"><div class="thumb"></div><h3>Product 4</h3><p class="price">400</p><button>Buy</button></div>
      <div class="card"><div class="thumb"></div><h3>Product 5</h3><p class="price">500</p><button>Buy</button></div>
      <div class="card"><div class="thumb"></div><h3>Product 6</h3><p class="price">600</p><button>Buy</button></div>
      <div class="card"><div class="thumb"></div><h3>Product 7</h3><p class="price">700</p><button>Buy</button></div>
      <div class="card"><div class="thumb"></div><h3>Product 8</h3><p class="price">800</p><button>Buy</button></div>
    </div>
  </main>

  <footer class="footer">Footer</footer>

</body>
</html>
