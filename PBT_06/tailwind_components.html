<!doctype html>
<html class="" lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tailwind Components — PBT_06</title>
  <script>
    window.tailwind = { config: { darkMode: 'class' } }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 p-6">
  <h1 class="text-2xl font-bold mb-4">Tailwind Components Demo</h1>
  <div class="space-y-4">
    <nav class="flex items-center justify-between p-3 bg-white rounded shadow">
      <div class="font-bold">Components</div>
      <div class="space-x-2">
        <button class="px-3 py-1 rounded bg-blue-500 text-white">Primary</button>
        <button class="px-3 py-1 rounded bg-gray-200">Secondary</button>
      </div>
    </nav>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="p-4 bg-white rounded shadow">
        <h3 class="font-semibold">Card</h3>
        <p class="text-sm text-gray-500">A simple card component.</p>
        <div class="mt-3"><button class="bg-orange-500 text-white px-4 py-2 rounded">Action</button></div>
      </div>
      <div class="p-4 bg-white rounded shadow">
        <h3 class="font-semibold">Form</h3>
        <input class="w-full border p-2 rounded mb-2" placeholder="Name">
        <textarea class="w-full border p-2 rounded mb-2" rows="3" placeholder="Message"></textarea>
        <div><button class="bg-green-500 text-white px-4 py-2 rounded">Send</button></div>
      </div>
    </div>
  </div>
</body>
</html>
