<body>
  <h1>PBT_07 — JS Basics</h1>
  <p>Output:</p>
  <pre id="out"></pre>
  <script>
    const out = document.getElementById('out');
    function write(){ out.textContent += Array.from(arguments).join(' ') + '\n'; }
    console.log = (...args)=> write(...args);
  </script>
