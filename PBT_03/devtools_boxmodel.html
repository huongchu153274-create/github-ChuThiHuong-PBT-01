<!doctype html>
<html>
<head>

<title>DevTools Box Model Demo</title>
<style>
  body{font-family:Arial;padding:20px}
  .outer{width:360px;margin:40px auto;background:#f6f9fc;padding:20px;border:8px solid #bcd}
  .inner{background:#fff;padding:16px;border:6px solid #8ab;color:#222}

</head>

  <h1>DevTools Box Model Diagram</h1>

    <div class="inner">Target box: inspect me</div>
  </div>
</body>
</html>
