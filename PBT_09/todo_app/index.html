<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Todo App — PBT_09</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Todo App</h1>
    <form id="todo-form">
      <input id="todo-input" placeholder="Nhập công việc..." aria-label="New todo" autocomplete="off">
      <button type="submit">Thêm</button>
    </form>

    <section>
      <ul id="todo-list"></ul>
    </section>

    <div class="controls">
      <button id="clear-completed">Xóa hoàn thành</button>
      <button id="clear-all">Xóa tất cả</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
