<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Validation Test</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;padding:20px;max-width:800px}</style>
</head>
<body>
  <h1>Validation Test</h1>
  <form>
    <div>
      <label for="t1">Required text (required)</label><br>
      <input type="text" id="t1" name="t1" required value="">
    </div>
    <div>
      <label for="e1">Email</label><br>
      <input type="email" id="e1" name="e1" value="abc">
    </div>
    <div>
      <label for="n1">Number 1-10</label><br>
      <input type="number" id="n1" name="n1" min="1" max="10" value="15">
    </div>
    <div>
      <label for="p1">Phone pattern (10 digits)</label><br>
      <input type="text" id="p1" name="p1" pattern="[0-9]{10}" value="abc123">
    </div>
    <div>
      <label for="pw">Password (minlength 8)</label><br>
      <input type="password" id="pw" name="pw" minlength="8" value="123">
    </div>
    <div style="margin-top:12px"><button type="submit">Submit</button></div>
  </form>
  <p>Submit để kiểm tra thông báo validation browser.</p>
</body>
</html>
