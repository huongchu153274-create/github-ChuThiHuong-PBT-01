<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thanh toán</title>
</head>
<body>
    <h1>Thanh toán đơn hàng</h1>

    <!-- Phần 1: Giỏ hàng -->
    <table border="1" style="width: 100%; border-collapse: collapse;">
        <thead>
            <tr>
                <th>STT</th>
                <th>Sản phẩm</th>
                <th>Đơn giá</th>
                <th>Số lượng</th>
                <th>Thành tiền</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>iPhone 16 Pro</td>
                <td>30.000.000</td>
                <td>1</td>
                <td>30.000.000</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Ốp lưng silicon</td>
                <td>500.000</td>
                <td>2</td>
                <td>1.000.000</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="4">Tổng cộng</th>
                <td><output name="total">31.000.000</output> VNĐ</td>
            </tr>
        </tfoot>
    </table>

    <form action="#" method="POST">
        <!-- Phần 2: Thanh toán -->
        <h3>Phương thức thanh toán</h3>
        <label><input type="radio" name="payment" value="cod" required> COD</label>
        <label><input type="radio" name="payment" value="bank"> Chuyển khoản</label>
        <br><br>

        <label for="coupon">Mã giảm giá:</label>
        <input type="text" id="coupon" name="coupon" 
               pattern="SALE[0-9]{4}" placeholder="VD: SALE2026">
        
        <p>Tìm nhanh sản phẩm: 
            <input type="search" list="products">
            <datalist id="products">
                <option value="iPhone 16">
                <option value="Macbook M3">
                <option value="iPad Pro">
            </datalist>
        </p>

        <!-- Phần 3: Giao hàng -->
        <h3>Thông tin nhận hàng</h3>
        <label for="delivery_date">Ngày giao mong muốn:</label>
        <input type="date" id="delivery_date" name="delivery_date" min="2026-05-07">
        <br><br>

        <label for="time_slot">Khung giờ:</label>
        <select id="time_slot">
            <option>Sáng 8-12h</option>
            <option>Chiều 14-18h</option>
            <option>Tối 18-21h</option>
        </select>
        <br><br>

        <label for="wait_time">Thời gian nhận hàng tối đa (ngày):</label>
        <input type="range" id="wait_time" min="1" max="7" step="1" value="3">
        <br><br>

        <p>Tiến trình hoàn thiện hồ sơ: <progress value="75" max="100"></progress> 75%</p>

        <button type="submit" aria-label="Xác nhận đặt hàng">Xác nhận đặt hàng</button>
    </form>
</body>
</html>
